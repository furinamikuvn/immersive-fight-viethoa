
#CLASS ENHANCEMENT CONFIGURATION
[general]
	#If true, disables the built-in classes (Warrior, Ranger, Tank, Civilian)
	disableDefaultClasses = false
	#Number of custom class slots (1-100). Restart required.
	#Range: 1 ~ 100
	customClassSlots = 5
	#Allow players to change their class after they have already selected it. (OPs can always change)
	allowClassReselection = false
	#Delay before opening class selection menu on login (in ticks, 20 = 1 second)
	#Range: 0 ~ 200
	menuDelayTicks = 20

["invulnerability stuff"]
	#Enable invulnerability for players.
	enableSetupImmunity = true
	#Prevent incoming damage.
	preventSetupDamage = true
	#Regularly extinguish players.
	clearSetupFire = true
	#Reset accumulated fall distance.
	resetSetupFall = true
	#Regularly max out player oxygen level.
	maxSetupAir = true
	#Keep food level maxed out.
	maxSetupFood = true
	#Keep player health maxed out.
	maxSetupHealth = true

#Animation & Visual Settings
[animations]
	#Speed of fade-in animations (higher = faster, 0.01-1.0)
	#Range: 0.01 ~ 1.0
	fadeInSpeed = 0.09
	#Speed of fade-out animations (higher = faster, 0.01-1.0)
	#Range: 0.01 ~ 1.0
	fadeOutSpeed = 0.12
	#Smoothness of scrolling (higher = smoother but slower, 0.1-0.5)
	#Range: 0.1 ~ 0.5
	scrollSmoothness = 0.3
	#Speed of button hover animations (0.01-0.5)
	#Range: 0.01 ~ 0.5
	buttonHoverSpeed = 0.22
	#Enable particle effects in the GUI
	enableParticles = true
	#Maximum number of particles (0-500)
	#Range: 0 ~ 500
	particleCount = 500

#Cross-Mod Integration Settings
[integration]
	#Wait for Difficulty Enhancement mod selection before opening (if installed)
	waitForDifficultySelection = true
	#Time to blend between difficulty and class selection screens (in seconds)
	#Range: 0.1 ~ 3.0
	transitionBlendTime = 0.8
	#Enable smooth gradient transition between screens
	smoothGradientTransition = true

#Built-In Class Settings
[classes]

	[classes.warrior]
		#Enable this class
		enabled = false
		#Display name shown in GUI. (Supports translation keys)
		name = "class.linggango.class_enhancement.warrior.name"
		#Lore text. (Supports translation keys & color codes).
		description = "class.linggango.class_enhancement.warrior.desc"
